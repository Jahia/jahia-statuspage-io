# Dependabot configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Module Federation shared libraries: majors must follow the Jahia platform
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-redux"
        update-types: ["version-update:semver-major"]
      # Tooling majors that need a manual migration
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      tests-npm-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia parent / platform artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts must match what Jahia 8.2 provides (Felix SCR 2.1.30 / DS 1.4)
      - dependency-name: "org.osgi:*"
      # Platform-provided GraphQL libraries (scope provided)
      - dependency-name: "com.graphql-java*"
      - dependency-name: "io.github.graphql-java:*"
      # frontend-maven-plugin 2.x requires a JDK 17 Maven runtime
      - dependency-name: "com.github.eirslett:frontend-maven-plugin"
        update-types: ["version-update:semver-major"]
      # Mockito 5 / JUnit 6 majors need a manual check
      - dependency-name: "org.mockito:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
